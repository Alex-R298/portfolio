<section>
    <div class="project-card">
        <app-navbar [darkMode]="true" (navClose)="closeCard()"></app-navbar>
        <img src="../../../assets/img/project-cards/Note book paper.png" alt="">
        <button class="go-back fontBricolageGrotesque" (click)="closeCard()">
            <img src="../../../assets/img/project-cards/Back 1.png" alt=""> {{ ts.t('Zurück') }}
        </button>

        <div class="content fontBricolageGrotesque">
            <!-- Linke Seite: Text Content -->
            <div class="left-content">
                <h1 #titleRef>{{ projectData?.name }}</h1>
                <img [style.width.px]="screenWidth <= 1024 ? projectData?.lineWidthTablet : projectData?.lineWidth"
                    [style.height.px]="projectData?.lineHeight" src="../../../assets/img/about-me/Color option 1.png"
                    alt="">

                <h2>{{ ts.t('Beschreibung') }}</h2>
                <p>{{ ts.t(projectData?.description) }}</p>

                <h2>{{ ts.t('Implementierungsdetails') }}</h2>
                <p>{{ ts.t(projectData?.implementation) }}</p>

                <div class="duration-section">
                    <h3>{{ ts.t('Dauer:') }}</h3>
                    <span>{{ ts.t(projectData?.duration) }}</span>
                </div>

                <!-- Skills -->
                <div class="skills">
                    <div *ngFor="let skill of projectData?.imgSkills; let i = index" class="skill-item">
                        <img [src]="'../../../assets/img/skill-set/skill-icons/' + skill" [alt]="skill">
                        <span>{{ projectData?.skillsNames[i] }}</span>
                    </div>
                </div>
            </div>

            <!-- Rechte Seite: Projekt-Bild und Buttons -->
            <div class="right-content">
                <img class="project-image" [src]="'../../../assets/img/projects/' + projectData?.img" alt="">

                <div class="action-buttons">
                    <a [href]="projectData?.githubLink" target="_blank" class="github-btn">GitHub</a>
                    <a [href]="projectData?.liveLink" target="_blank" class="live-test-btn">Live Test</a>
                </div>
            </div>
        </div>

        <!-- Next Project Button (unten) -->
        <button class="next-project fontBricolageGrotesque" (click)="nextProject()">
            {{ ts.t('Nächstes Projekt') }} <img src="../../../assets/img/project-cards/Back 1 (1).png" alt="">
        </button>
    </div>
</section>
